[package]
name = "hi-interpreter"
version = "1.4.0"
edition = "2024"

[[bin]]
name = "hi"
path = "src/main.rs"

[dependencies]
anyhow = "1.0.103"
clap = { version = "4.6.2", features = ["derive"] }
colored = "3.1.1"
rustyline = "18.0.1"
thiserror = "2.0.18"

[dev-dependencies]
stdio-override = "0.2.0"
tempfile = "3.27.0"
