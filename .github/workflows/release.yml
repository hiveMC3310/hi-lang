name: Build and Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  lint:
    name: Lint and test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: lint-cargo-${{ hashFiles('**/Cargo.lock') }}
      - name: Check formatting
        run: cargo fmt -- --check
      - name: Run clippy
        run: cargo clippy -- -A warnings
      - name: Run tests
        run: cargo test -- --test-threads=1 --nocapture

  build:
    needs: lint
    name: Build for ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - target: x86_64-unknown-linux-musl
            os: ubuntu-latest
            ext: ''
            archive_ext: tar.gz
          - target: x86_64-pc-windows-msvc
            os: windows-latest
            ext: '.exe'
            archive_ext: zip
          - target: aarch64-apple-darwin
            os: macos-latest
            ext: ''
            archive_ext: tar.gz
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          target: ${{ matrix.target }}
      - name: Install musl tools (Linux musl)
        if: matrix.target == 'x86_64-unknown-linux-musl'
        run: sudo apt-get update && sudo apt-get install -y musl-tools
      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ matrix.target }}-cargo-${{ hashFiles('**/Cargo.lock') }}
      - name: Build release binaries
        run: cargo build --release --target ${{ matrix.target }} --bin hi --bin hi-lsp
      - name: Prepare archive
        shell: bash
        run: |
          mkdir -p release
          cp target/${{ matrix.target }}/release/hi${{ matrix.ext }} release/
          cp target/${{ matrix.target }}/release/hi-lsp${{ matrix.ext }} release/
          chmod +x release/* || true
          cd release
          if [ "${{ matrix.archive_ext }}" == "zip" ]; then
            7z a ../hi-${{ github.ref_name }}-${{ matrix.target }}.zip .
          else
            tar czf ../hi-${{ github.ref_name }}-${{ matrix.target }}.tar.gz .
          fi
      - name: Generate checksums
        shell: bash
        run: |
          cd release
          sha256sum * > ../checksums-${{ matrix.target }}.txt
      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: hi-${{ matrix.target }}
          path: |
            hi-${{ github.ref_name }}-${{ matrix.target }}.${{ matrix.archive_ext }}
            checksums-${{ matrix.target }}.txt

  release:
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - uses: softprops/action-gh-release@v2
        with:
          files: artifacts/**/*
          draft: false
          prerelease: false
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}